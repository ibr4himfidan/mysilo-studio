server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __PUBLIC_HOST__;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 308 https://__PUBLIC_HOST__$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __PUBLIC_HOST__;
    ssl_certificate /etc/letsencrypt/live/mysilo-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mysilo-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mysilo_tls:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    client_max_body_size 3m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:5188;
        proxy_http_version 1.1;
        proxy_set_header Host __PUBLIC_HOST__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
